# FerriteCMS cluster example: 2 ferrite nodes + Postgres + RustFS (S3) + Caddy.
#
# Usage (from the repository root):
#   docker compose -f examples/cluster/docker-compose.yml up --build
#   open http://localhost:8080
#   docker compose -f examples/cluster/docker-compose.yml exec node1 /ferrite seed demo --data /data
#   docker compose -f examples/cluster/docker-compose.yml exec node1 /ferrite config check --data /data
#
# Both nodes start at once on an empty database; one applies the migrations under the
# `migrate` advisory lock, the other waits for it (design 04 §9). Changes saved through
# either node reach the other through Postgres LISTEN/NOTIFY (design 04 §4).
#
# DEMO CREDENTIALS: the passwords below and in ferrite.env are placeholders shared
# between the services, and ferrite.env's site key (FERRITE_AUTH__SECRET_KEY, one value for
# both nodes) is public. Change them together before exposing anything.
#
# Status: verified by `ferrite config check` (crates/ferrite/tests/examples.rs) and by
# `docker compose config`, `caddy validate` + `docker build` in CI; `docker compose up` itself is not run
# in CI (docs/superpowers/m15-exit.md).

name: ferrite-cluster

x-ferrite-node: &ferrite-node
  build: ../..
  image: ferrite:example
  command: ["serve", "--data", "/data"]
  env_file: ferrite.env
  volumes:
    - ./ferrite.toml:/data/ferrite.toml:ro
  healthcheck:
    test: ["CMD", "/ferrite", "healthcheck", "--url", "http://127.0.0.1:8080/readyz"]
    interval: 5s
    timeout: 6s
    retries: 5
    start_period: 30s
  depends_on:
    postgres:
      condition: service_healthy
    bucket-init:
      condition: service_completed_successfully
  # Shutdown is bounded at 14 s (design 09 §3); give it room before SIGKILL.
  stop_grace_period: 20s
  networks: [ferrite]

services:
  postgres:
    image: postgres:18@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
    environment:
      POSTGRES_USER: ferrite
      POSTGRES_PASSWORD: ferrite-demo-password
      POSTGRES_DB: ferrite
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "ferrite", "-d", "ferrite"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      # postgres:18 keeps its data under /var/lib/postgresql/18/docker.
      - pgdata:/var/lib/postgresql
    networks: [ferrite]

  # S3-compatible object store: RustFS (Apache-2.0, single container). MinIO's community
  # images are no longer published (docs/design/09-operations.md 7). Runs as UID 10001;
  # the named volume needs no extra setup.
  rustfs:
    image: rustfs/rustfs:1.0.4@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ferrite-demo
      RUSTFS_SECRET_KEY: ferrite-demo-secret
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "false"
    volumes:
      - rustfsdata:/data
    networks: [ferrite]

  bucket-init:
    image: amazon/aws-cli:2.34.0@sha256:97cc5f847898f54432492c128408c62e0df2153d9ad36573be8e5a03826123b0
    depends_on: [rustfs]
    environment:
      AWS_ACCESS_KEY_ID: ferrite-demo
      AWS_SECRET_ACCESS_KEY: ferrite-demo-secret
      AWS_DEFAULT_REGION: us-east-1
    entrypoint:
      - /bin/sh
      - -c
      - |
        until aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket ferrite 2>/dev/null \
          || aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket ferrite; do sleep 1; done
    networks: [ferrite]

  node1:
    <<: *ferrite-node
    environment:
      FERRITE_CLUSTER__NODE_NAME: node1

  node2:
    <<: *ferrite-node
    environment:
      FERRITE_CLUSTER__NODE_NAME: node2

  caddy:
    image: caddy:2@sha256:5e5286cb37d44086d651a5363f05f43a692ce4d649d88fb1bd844579f45fa9e8
    ports:
      - "8080:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on: [node1, node2]
    networks: [ferrite]

networks:
  ferrite:
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  pgdata:
  rustfsdata:
