[package]
name = "ferrite-http"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Test seams (10-testing §2): only this crate's tests and the `ferrite` crate's tests
# enable it, through the dev-dependencies on themselves; never a normal build.
test-seams = ["ferrite-core/test-seams"]

[dependencies]
arc-swap.workspace = true
async-trait.workspace = true
axum.workspace = true
bytes.workspace = true
chrono.workspace = true
ferrite-cache = { path = "../ferrite-cache" }
ferrite-config = { path = "../ferrite-config" }
ferrite-core = { path = "../ferrite-core" }
ferrite-domain = { path = "../ferrite-domain" }
ferrite-media = { path = "../ferrite-media" }
ferrite-plugin-host = { path = "../ferrite-plugin-host" }
ferrite-store = { path = "../ferrite-store" }
ferrite-theme = { path = "../ferrite-theme" }
futures.workspace = true
html-escape.workspace = true
ipnet.workspace = true
lettre.workspace = true
percent-encoding.workspace = true
reqwest.workspace = true
rust-embed.workspace = true
rustls.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net"] }
tokio-util.workspace = true
toml.workspace = true
tower-http.workspace = true
tracing.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true
url.workspace = true
uuid.workspace = true
webpki-roots.workspace = true
zeroize.workspace = true

[dev-dependencies]
ferrite-http = { path = ".", features = ["test-seams"] }
ferrite-store-tests = { path = "../ferrite-store-tests" }
http-body-util.workspace = true
hyper-util.workspace = true
quick-xml.workspace = true
s3s.workspace = true
s3s-fs.workspace = true
tar.workspace = true
tempfile.workspace = true
tokio-rustls.workspace = true
totp-rs.workspace = true
tower = { workspace = true, features = ["util"] }
