[package]
name = "ferrite-import-wp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Test seams (10-testing §2): enabled by this crate's tests through the dev-dependency on
# itself; never by a normal build.
test-seams = []

[dependencies]
async-trait.workspace = true
bytes.workspace = true
ferrite-core = { path = "../ferrite-core" }
ferrite-domain = { path = "../ferrite-domain" }
ferrite-media = { path = "../ferrite-media" }
futures.workspace = true
html5ever.workspace = true
quick-xml.workspace = true
scraper.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs"] }
tokio-util = { workspace = true, features = ["io"] }
tracing.workspace = true
unicode-normalization.workspace = true
url.workspace = true
uuid.workspace = true
zip.workspace = true

[dev-dependencies]
ferrite-import-wp = { path = ".", features = ["test-seams"] }
ferrite-store = { path = "../ferrite-store" }
ferrite-store-tests = { path = "../ferrite-store-tests" }
tempfile.workspace = true
