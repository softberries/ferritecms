[package]
name = "ferrite-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Test seams (10-testing §2): enabled by this crate's tests through the dev-dependency on
# itself and by `ferrite-http/test-seams`; never by a normal build.
test-seams = []

[dependencies]
ammonia.workspace = true
arc-swap.workspace = true
argon2.workspace = true
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
chacha20poly1305.workspace = true
chrono.workspace = true
deunicode.workspace = true
ferrite-domain = { path = "../ferrite-domain" }
ferrite-store = { path = "../ferrite-store" }
getrandom.workspace = true
hmac.workspace = true
html-escape.workspace = true
percent-encoding.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync"] }
totp-rs.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true
zeroize.workspace = true

[dev-dependencies]
ferrite-core = { path = ".", features = ["test-seams"] }
ferrite-media = { path = "../ferrite-media" }
ferrite-store-tests = { path = "../ferrite-store-tests" }
futures.workspace = true
tempfile.workspace = true
