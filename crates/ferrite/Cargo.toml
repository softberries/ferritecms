[package]
name = "ferrite"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
clap = { version = "4.6.7", features = ["derive"] }
ferrite-config = { path = "../ferrite-config" }
ferrite-domain = { path = "../ferrite-domain" }
ferrite-store = { path = "../ferrite-store" }
ferrite-store-postgres = { path = "../ferrite-store-postgres" }
ferrite-store-sqlite = { path = "../ferrite-store-sqlite" }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
semver.workspace = true
sqlx.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
assert_cmd = "2.2.2"
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }
uuid.workspace = true
