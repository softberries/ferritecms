[package]
name = "ferrite"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Test seams (10-testing §2): only the tests enable it, through the dev-dependency on
# this crate itself; `cargo build -p ferrite --release` never does.
test-seams = ["ferrite-http/test-seams"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
bytes.workspace = true
clap = { version = "4.6.7", features = ["derive"] }
ferrite-cache = { path = "../ferrite-cache" }
ferrite-cluster = { path = "../ferrite-cluster" }
ferrite-config = { path = "../ferrite-config" }
ferrite-core = { path = "../ferrite-core" }
ferrite-domain = { path = "../ferrite-domain" }
ferrite-http = { path = "../ferrite-http" }
ferrite-media = { path = "../ferrite-media" }
ferrite-plugin-host = { path = "../ferrite-plugin-host" }
ferrite-store = { path = "../ferrite-store" }
ferrite-store-postgres = { path = "../ferrite-store-postgres" }
ferrite-store-sqlite = { path = "../ferrite-store-sqlite" }
ferrite-theme = { path = "../ferrite-theme" }
futures.workspace = true
image.workspace = true
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
semver.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
tokio = { workspace = true, features = ["net", "signal"] }
toml.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url.workspace = true
uuid.workspace = true

[dev-dependencies]
ferrite = { path = ".", features = ["test-seams"] }
assert_cmd = "2.2.2"
ferrite-store-tests = { path = "../ferrite-store-tests" }
hyper-util.workspace = true
s3s.workspace = true
s3s-fs.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "net"] }
uuid.workspace = true
