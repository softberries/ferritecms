<!doctype html>
<html lang="{{ site.locale }}">
<head>{{ head() }}<link rel="stylesheet" href="{{ asset('css/site.css') }}"></head>
<body>
{% include "partials/header.html" %}
{% if post %}<article><h1>{{ post.title }}</h1>{{ post.body }}</article>{% endif %}
{% if posts %}<ul>{% for p in posts.items %}<li><a href="{{ p.url }}">{{ p.title }}</a></li>{% endfor %}</ul>{% endif %}
</body>
</html>
