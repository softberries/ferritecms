name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: ferrite
          POSTGRES_DB: ferrite_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            plugins
      - run: cargo fmt --all --check
      - run: cargo fmt --manifest-path plugins/Cargo.toml --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo build --manifest-path plugins/Cargo.toml --release --target wasm32-wasip2
      - run: cargo clippy --manifest-path plugins/Cargo.toml --target wasm32-wasip2 -- -D warnings
      - run: cargo test --workspace
        env:
          FERRITE_TEST_PG_URL: postgres://ferrite@localhost:5432/ferrite_test
