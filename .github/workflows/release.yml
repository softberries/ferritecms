name: Release

# The release process (M4-2 P25–P27, P37, P38):
# - a `vX.Y.Z` tag push builds every target, writes SHA256SUMS, signs it with the release
#   key, publishes a GitHub Release (a draft until every asset is uploaded) and the image
#   ghcr.io/<owner>/<repo> (linux/amd64 + linux/arm64, tags X.Y.Z, X.Y and latest);
# - a manual run (`workflow_dispatch`) is a dry run by default: the same builds, signed
#   with a throwaway key made in the job, uploaded as workflow artifacts only. A manual
#   run on a tag with `dry_run: false` publishes like the tag push (re-running a release).
# `latest` (GitHub's latest release, which `ferrite self-update` installs, and the image
# tag) moves only for the newest stable version, and `X.Y` only for the newest of its line
# (.github/scripts/newest.sh), so a backport release does not take them back.
#
# Repository setup (once, by a maintainer): create the environment `release` (Settings ->
# Environments) with a deployment policy that allows only tags matching `v*` (and
# required reviewers if wanted), and store MINISIGN_SECRET_KEY (the minisign secret key
# file) and MINISIGN_PASSWORD as that environment's secrets, not as repository secrets.
# The jobs that publish or hold the key run in that environment, so a branch with an
# edited copy of this workflow cannot reach the key. (Environments in a private
# repository need a paid GitHub plan.)
#
# Every action is pinned by its commit SHA (the comment names the version).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and sign with a throwaway key, publish nothing
        type: boolean
        default: true

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # The version, whether this run publishes, and the release-gate checks.
  meta:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      minor: ${{ steps.meta.outputs.minor }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      publish: ${{ steps.meta.outputs.publish }}
      latest: ${{ steps.meta.outputs.latest }}
      minor_latest: ${{ steps.meta.outputs.minor_latest }}
    steps:
      # Full history: newest.sh compares against every v* tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: meta
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          core=${version%%-*}
          minor=${core%.*}
          prerelease=false
          if [ "$core" != "$version" ]; then prerelease=true; fi
          publish=false
          if [[ "$REF" == refs/tags/v* ]]; then
            if [ "$REF_NAME" != "v$version" ]; then
              echo "::error::tag $REF_NAME does not match the workspace version $version (expected v$version)"
              exit 1
            fi
            if [ "$EVENT" = push ] || [ "$DRY_RUN" = false ]; then publish=true; fi
          elif [ "$DRY_RUN" = false ]; then
            echo "::notice::dry_run is off, but $REF is not a v* tag: publishing nothing"
          fi
          if [ "$publish" = true ] && ! grep -v '^[[:space:]]*#' crates/ferrite/release.pub | grep -q '[^[:space:]]'; then
            echo "::error::crates/ferrite/release.pub is still the placeholder: a release built from it could never self-update"
            exit 1
          fi
          {
            echo "version=$version"
            echo "minor=$minor"
            echo "prerelease=$prerelease"
            echo "publish=$publish"
            .github/scripts/newest.sh "$version"
          } >> "$GITHUB_OUTPUT"
          echo "version $version (X.Y $minor), prerelease $prerelease, publish $publish"
          .github/scripts/newest.sh "$version"

  # The admin SPA, built once and embedded by every target's build.
  admin:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: admin/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm -C admin install --frozen-lockfile
      - run: pnpm -C admin build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: admin-dist
          path: admin/dist/
          if-no-files-found: error
          retention-days: 7

  # One asset per target (P25, P27), each on a native runner. The glibc builds use
  # Ubuntu 22.04 so the binaries need glibc 2.35, not 24.04's 2.39. No build cache: a
  # release is built from scratch.
  build:
    needs: [meta, admin]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            musl: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            musl: true
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: admin-dist
          path: admin/dist
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      # The C code (bundled SQLite, zstd) is compiled with musl-gcc; the crypto is
      # ring-only (P28), so no cmake or clang.
      - name: musl toolchain
        if: matrix.musl
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          echo "CC_${TARGET//-/_}=musl-gcc" >> "$GITHUB_ENV"
      - run: cargo build --release --locked -p ferrite --target "$TARGET"
      - name: smoke test
        run: |
          bin="target/$TARGET/release/ferrite"
          file "$bin"
          out=$("$bin" --version)
          echo "$out"
          if [ "$out" != "ferrite $VERSION" ]; then
            echo "::error::expected 'ferrite $VERSION', got '$out'"
            exit 1
          fi
      - name: musl binary is static
        if: matrix.musl
        run: |
          bin="target/$TARGET/release/ferrite"
          needed=$(readelf -d "$bin" | grep -c '(NEEDED)' || true)
          kind=$(file -b "$bin")
          if [ "$needed" -ne 0 ] || ! [[ "$kind" =~ statically\ linked|static-pie\ linked ]]; then
            readelf -d "$bin" || true
            echo "::error::the musl binary is not static ($needed NEEDED entries; file: $kind)"
            exit 1
          fi
      - run: .github/scripts/package.sh "$VERSION" "$TARGET" "target/$TARGET/release/ferrite" dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # SHA256SUMS (sha256sum format) over every asset and its minisign signature (P26),
  # made with the release key of the `release` environment. Only one of the two sign jobs
  # runs; both upload the artifact `release`.
  sign:
    needs: [meta, build]
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - run: .github/scripts/sums.sh dist
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign
          minisign -v
      - name: Sign with the release key
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "::error::the MINISIGN_SECRET_KEY secret is not set in the release environment"
            exit 1
          fi
          umask 077
          key="$RUNNER_TEMP/release.key"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s "$key" -m dist/SHA256SUMS -x dist/SHA256SUMS.minisig
      # Against the key the binaries embed: a secret key that does not match it fails here.
      - run: .github/scripts/verify-sig.sh crates/ferrite/release.pub dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # A dry run signs with a throwaway key made here (its .pub goes into the artifact).
  sign-dry-run:
    needs: [meta, build]
    if: needs.meta.outputs.publish != 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - run: .github/scripts/sums.sh dist
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign
          minisign -v
      - name: Sign with a throwaway key
        run: |
          minisign -G -W -p dist/throwaway.pub -s "$RUNNER_TEMP/throwaway.key"
          minisign -S -s "$RUNNER_TEMP/throwaway.key" -m dist/SHA256SUMS -x dist/SHA256SUMS.minisig
      - run: .github/scripts/verify-sig.sh dist/throwaway.pub dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # The GitHub Release (P25): a draft until every asset is present, then published. A
  # draft left by an earlier failed run of the same tag is reused.
  release:
    needs: [meta, sign]
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: v${{ needs.meta.outputs.version }}
      PRERELEASE: ${{ needs.meta.outputs.prerelease }}
      LATEST: ${{ needs.meta.outputs.latest }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - name: Draft
        run: |
          if gh release view "$TAG" --json isDraft --jq .isDraft > draft.txt 2>/dev/null; then
            if [ "$(cat draft.txt)" != true ]; then
              echo "::error::release $TAG is already published"
              exit 1
            fi
            echo "reusing the draft of $TAG"
          else
            flags=()
            if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
            gh release create "$TAG" --draft --verify-tag --title "FerriteCMS $TAG" --generate-notes --latest=false "${flags[@]}"
          fi
      - name: Upload the assets
        run: |
          gh release upload "$TAG" --clobber dist/ferrite-*.tar.gz dist/SHA256SUMS dist/SHA256SUMS.minisig
          count=$(gh release view "$TAG" --json assets --jq '.assets | length')
          if [ "$count" -ne 8 ]; then
            gh release view "$TAG" --json assets --jq '.assets[].name'
            echo "::error::expected 8 assets on $TAG, found $count"
            exit 1
          fi
      # Only the newest stable version becomes GitHub's latest release (newest.sh).
      - name: Publish
        run: |
          if [ "$LATEST" = true ]; then
            gh release edit "$TAG" --draft=false --latest
          else
            gh release edit "$TAG" --draft=false --latest=false
          fi

  # The image (P37), built natively per platform and pushed by digest once the binaries
  # are built and signed; `image-tags` joins the digests under the version tags once the
  # release is out.
  image:
    needs: [meta, build, sign]
    if: needs.meta.outputs.publish == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            os: ubuntu-24.04
          - platform: linux/arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: name
        env:
          REPO: ${{ github.repository }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          echo "image=ghcr.io/${REPO,,}" >> "$GITHUB_OUTPUT"
          echo "pair=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ steps.name.outputs.image }},push-by-digest=true,name-canonical=true,push=true
      - env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ steps.name.outputs.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  image-tags:
    needs: [meta, image, release]
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - working-directory: ${{ runner.temp }}/digests
        env:
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.meta.outputs.version }}
          MINOR: ${{ needs.meta.outputs.minor }}
          LATEST: ${{ needs.meta.outputs.latest }}
          MINOR_LATEST: ${{ needs.meta.outputs.minor_latest }}
        run: |
          image="ghcr.io/${REPO,,}"
          tags=(-t "$image:$VERSION")
          # X.Y follows the newest stable release of that line and latest the newest stable
          # release (newest.sh); a prerelease gets only its own tag.
          if [ "$MINOR_LATEST" = true ]; then tags+=(-t "$image:$MINOR"); fi
          if [ "$LATEST" = true ]; then tags+=(-t "$image:latest"); fi
          refs=()
          for d in *; do refs+=("$image@sha256:$d"); done
          if [ "${#refs[@]}" -ne 2 ]; then
            echo "::error::expected 2 platform digests, found ${#refs[@]}"
            exit 1
          fi
          docker buildx imagetools create "${tags[@]}" "${refs[@]}"
          docker buildx imagetools inspect "$image:$VERSION"
