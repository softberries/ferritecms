[workspace]
resolver = "3"
members = ["crates/ferrite-domain", "crates/ferrite-plugin-host", "crates/ferrite-sdk"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
anyhow = "1"
arc-swap = "1"
async-trait = "0.1.92"
base64 = "0.23"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
criterion = "0.8"
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "sqlite", "postgres", "migrate", "macros", "json", "uuid", "chrono"] }
semver = { version = "1.0.28", features = ["serde"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
toml = "1.1"
tracing = "0.1"
uuid = { version = "1", features = ["v7", "serde"] }
wasmtime = "50"
wasmtime-wasi = "50"
wasmtime-wasi-io = "50"
wit-bindgen = "0.63"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
