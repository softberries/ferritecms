[workspace]
resolver = "3"
members = ["crates/ferrite-domain", "crates/ferrite-store", "crates/ferrite-store-postgres", "crates/ferrite-store-sqlite", "crates/ferrite-store-tests", "crates/ferrite-plugin-host", "crates/ferrite-sdk", "crates/ferrite-media", "crates/ferrite-config", "crates/ferrite-core", "crates/ferrite-http", "crates/ferrite-theme", "crates/ferrite"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
ammonia = "4.2.4"
anyhow = "1"
arc-swap = "1"
async-trait = "0.1.92"
base64 = "0.23"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
criterion = "0.8"
deunicode = "1.6.2"
futures = "0.3"
html-escape = "0.3.0"
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "server"] }
ipnet = "2"
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
infer = "0.22"
# No `debug` feature: no debug() global, no source snippets in errors (name + line stay).
minijinja = { version = "=3.0.2", default-features = false, features = ["builtins", "macros", "multi_template", "adjacent_loop_items", "std_collections", "serde", "json", "fuel"] }
percent-encoding = "2"
rust-embed = { version = "8.13", features = ["debug-embed"] }
object_store = { version = "0.14", features = ["aws"] }
s3s = "0.17"
s3s-fs = "0.17"
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "sqlite", "postgres", "migrate", "macros", "json", "uuid", "chrono"] }
semver = { version = "1.0.28", features = ["serde"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
toml = "1.1"
tracing = "0.1"
unicode-normalization = "0.1.25"
url = "2"
uuid = { version = "1", features = ["v7", "serde"] }
wasmtime = "50"
wasmtime-wasi = "50"
wasmtime-wasi-io = "50"
wit-bindgen = "0.63"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
