[workspace]
resolver = "3"
members = ["crates/ferrite-domain", "crates/ferrite-store", "crates/ferrite-store-postgres", "crates/ferrite-store-sqlite", "crates/ferrite-store-tests", "crates/ferrite-plugin-host", "crates/ferrite-sdk", "crates/ferrite-media", "crates/ferrite-config", "crates/ferrite-core", "crates/ferrite-http", "crates/ferrite-theme", "crates/ferrite-cache", "crates/ferrite-cluster", "crates/ferrite"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
ammonia = "4.2.4"
anyhow = "1"
arc-swap = "1"
argon2 = "=0.6.0"
async-trait = "0.1.92"
axum = { version = "0.8.9", default-features = false, features = ["http1", "http2", "json", "multipart", "original-uri", "query", "tokio"] }
base64 = "0.23"
bytes = "1"
chacha20poly1305 = "=0.11.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
criterion = "0.8"
deunicode = "1.6.2"
futures = "0.3"
getrandom = "=0.4.3"
hmac = "=0.13.0"
html-escape = "0.3.0"
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "server"] }
ipnet = "2"
lettre = { version = "=0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "ring", "webpki-roots"] }
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
infer = "0.22"
# No `debug` feature: no debug() global, no source snippets in errors (name + line stay).
moka = { version = "0.12", features = ["future"] }
minijinja = { version = "=3.0.2", default-features = false, features = ["builtins", "macros", "multi_template", "adjacent_loop_items", "std_collections", "serde", "json", "fuel", "urlencode"] }
percent-encoding = "2"
quick-xml = "=0.41.0"
# Plugin `http` (M2a-2b P17): rustls with the platform verifier; no proxy, cookie or
# decompression features.
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }
rust-embed = { version = "8.13", features = ["debug-embed"] }
object_store = { version = "0.14", features = ["aws"] }
s3s = "0.17"
s3s-fs = "0.17"
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "sqlite", "postgres", "migrate", "macros", "json", "uuid", "chrono"] }
semver = { version = "1.0.28", features = ["serde"] }
serde_json = "1"
# Already in the tree through axum `json`/`query`; used directly for the field path of a
# rejected JSON body.
serde_path_to_error = "0.1.20"
tar = { version = "0.4.46", default-features = false }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring"] }
tokio-util = "0.7"
totp-rs = { version = "=6.0.0", features = ["otpauth"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["catch-panic", "compression-br", "compression-gzip", "set-header", "trace"] }
toml = "1.1"
tracing = "0.1"
unicode-normalization = "0.1.25"
url = "2"
utoipa = { version = "=6.0.0", features = ["uuid", "chrono"] }
utoipa-axum = "=0.3.0"
uuid = { version = "1", features = ["v7", "serde"] }
# Fallback roots for plugin `http` on hosts without a CA bundle (ruling R19); already
# linked through lettre.
webpki-roots = "=1.0.10"
wasmtime = "50"
wasmtime-wasi = "50"
wasmtime-wasi-io = "50"
wit-bindgen = "0.63"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
