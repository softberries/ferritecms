[workspace]
resolver = "3"
members = ["crates/ferrite-domain", "crates/ferrite-store", "crates/ferrite-store-postgres", "crates/ferrite-store-sqlite", "crates/ferrite-store-tests", "crates/ferrite-plugin-host", "crates/ferrite-sdk", "crates/ferrite-media", "crates/ferrite-config", "crates/ferrite-core", "crates/ferrite-http", "crates/ferrite-theme", "crates/ferrite-cache", "crates/ferrite-cluster", "crates/ferrite-import-wp", "crates/ferrite-import-md", "crates/ferrite"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
ammonia = "4.2.4"
anyhow = "1"
arc-swap = "1"
argon2 = "=0.6.0"
async-trait = "0.1.92"
axum = { version = "0.8.9", default-features = false, features = ["http1", "http2", "json", "multipart", "original-uri", "query", "tokio"] }
base64 = "0.23"
bytes = "1"
chacha20poly1305 = "=0.11.0"
jiff = { version = "=0.2.38", default-features = false, features = ["std", "tzdb-bundle-always"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
criterion = "0.8"
deunicode = "1.6.2"
futures = "0.3"
getrandom = "=0.4.3"
# `zeroize`: HMAC key state is wiped on drop (M2a-2b P24).
hmac = { version = "=0.13.0", features = ["zeroize"] }
html-escape = "0.3.0"
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "server"] }
ipnet = "2"
lettre = { version = "=0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "ring", "webpki-roots"] }
libc = "0.2"
# `ferrite doctor` asks the kernel whether it may write (access(2)) instead of writing
# a probe; already in the tree through tempfile (M4-3a P49).
rustix = { version = "=1.1.5", default-features = false, features = ["fs", "std"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
infer = "0.22"
# The Markdown import (M4-3b P62): CommonMark to HTML only, no CLI (`getopts`).
pulldown-cmark = { version = "=0.13.6", default-features = false, features = ["html"] }
# No `debug` feature: no debug() global, no source snippets in errors (name + line stay).
moka = { version = "0.12", features = ["future"] }
minijinja = { version = "=3.0.2", default-features = false, features = ["builtins", "macros", "multi_template", "adjacent_loop_items", "std_collections", "serde", "json", "fuel", "urlencode"] }
percent-encoding = "2"
quick-xml = "=0.41.0"
# The WordPress importer's HTML parser (M3 Task 11): the html5ever ammonia already pulls in, and
# scraper for the DOM, since markup5ever_rcdom has no release for html5ever 0.40.
html5ever = "=0.40.1"
scraper = { version = "0.29", default-features = false }
# Plugin `http` (M2a-2b P17): rustls with the platform verifier; no proxy, cookie or
# decompression features.
# `rustls-no-provider`, not `rustls` (which turns on aws-lc-rs): ring only (M4-2 P28). A
# client takes the process default provider and panics without one, so every place that
# builds a client (here or through object_store) installs ring first; `main` does too.
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider"] }
# `tls12` explicitly: the built-in TLS listener (M4-2 P33) serves TLS 1.2 clients too,
# not only because another crate happens to turn it on.
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
# Built-in ACME TLS for solo sites (M4-2 P33): TLS-ALPN-01 on the TLS listener. `ring` only
# (its default `aws-lc-rs` would link aws-lc, P28); the ACME client's roots are webpki-roots,
# passed in through `new_with_client_config`, so its `webpki-roots` feature is not needed.
rustls-acme = { version = "=0.15.4", default-features = false, features = ["ring"] }
rust-embed = { version = "8.13", features = ["debug-embed"] }
# `aws-base` + `reqwest` + `ring` is `aws` without aws-lc-rs (M4-2 P28): SigV4 signing on
# ring, TLS through reqwest on the process default (ring) provider. reqwest's TLS comes from
# its own `rustls-no-provider` feature, which ferrite-media turns on by depending on it.
object_store = { version = "0.14", default-features = false, features = ["fs", "aws-base", "reqwest", "ring"] }
s3s = "0.17"
s3s-fs = "0.17"
# `zeroize`: the SHA-256 states inside an HMAC (derived from its key) are wiped on drop
# (M2a-2b P24); `hmac`'s own `zeroize` only reaches its buffers.
sha2 = { version = "0.11", features = ["zeroize"] }
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "sqlite", "postgres", "migrate", "macros", "json", "uuid", "chrono"] }
semver = { version = "1.0.28", features = ["serde"] }
serde_json = "1"
# Already in the tree through axum `json`/`query`; used directly for the field path of a
# rejected JSON body.
serde_path_to_error = "0.1.20"
tar = { version = "0.4.46", default-features = false }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring"] }
tokio-util = "0.7"
# `zeroize`: the secret copies inside `Totp`, its builder and `Secret` are wiped on drop
# (M2a-2b P24).
totp-rs = { version = "=6.0.0", features = ["otpauth", "zeroize"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["catch-panic", "compression-br", "compression-gzip", "set-header", "trace"] }
toml = "1.1"
tracing = "0.1"
unicode-normalization = "=0.1.26"
url = "2"
utoipa = { version = "=6.0.0", features = ["uuid", "chrono"] }
utoipa-axum = "=0.3.0"
uuid = { version = "1", features = ["v7", "serde"] }
# Export and backup archives (`tar.zst`, M4-1 P7).
zstd = { version = "=0.14.3", default-features = false }
# Fallback roots for plugin `http` on hosts without a CA bundle (ruling R19); already
# linked through lettre.
webpki-roots = "=1.0.10"
# The WordPress importer reads an uploads zip in place (M3-2 P24): stored and deflate
# entries only; flate2 (zlib-rs) inflates, no zopfli.
zip = { version = "=9.1.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# Wipes keys and passwords from memory on drop (M2a-2b P24); already in the tree.
zeroize = { version = "=1.9.1", features = ["derive"] }
wasmtime = "50"
wasmtime-wasi = "50"
wasmtime-wasi-io = "50"
wit-bindgen = "0.63"

# Release builds (M4-2 P27): smaller and faster binaries for a slower build.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Password hashing optimised in dev and test builds too (M4-4 P82): unoptimised argon2id
# takes long enough per hash that a loaded test run spent its rate-limit window on it.
# blake2 is argon2's own hash (H0 and the final H').
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.test.package.argon2]
opt-level = 3
[profile.test.package.blake2]
opt-level = 3

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
