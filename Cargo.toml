[workspace]
resolver = "3"
members = ["crates/ferrite-plugin-host", "crates/ferrite-sdk"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
anyhow = "1"
arc-swap = "1"
criterion = "0.8"
serde = { version = "1", features = ["derive"] }
semver = { version = "1.0.28", features = ["serde"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
toml = "1.1"
tracing = "0.1"
wasmtime = "50"
wasmtime-wasi = "50"
wit-bindgen = "0.63"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
