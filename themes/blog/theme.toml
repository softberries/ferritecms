# The default starter theme (06 §1, §8). Plain MiniJinja templates and CSS, no build step.
[theme]
name        = "blog"
version     = "0.1.0"
author      = "FerriteCMS"
license     = "AGPL-3.0-only"
homepage    = "https://github.com/softberries/ferritecms"
description = "An editorial blog: a lead story, image cards, long-form articles with a table of contents, comments and related posts. Light and dark modes."

[menus]
primary = "Primary navigation"
footer  = "Footer"

[images]
card = { width = 640, height = 360, crop = true }
hero = { width = 1280, height = 640, crop = true }

[settings]
# Link and button text use the accent mixed with black (light scheme) or white (dark
# scheme); a mid-tone accent keeps that text above 4.5:1 in both, a very pale or very
# dark one may not.
accent_color  = { type = "color", default = "#be185d", label = "Accent colour (mid-tones keep links readable in light and dark mode)" }
show_author   = { type = "bool", default = true, label = "Show post authors" }
show_excerpts = { type = "bool", default = true, label = "Show excerpts in listings" }

# The theme's own texts in German (M6-1, `t()`); a text without an entry prints as written.
[strings.de]
"Skip to content" = "Zum Inhalt springen"
"Preview: this content is not published." = "Vorschau: Dieser Inhalt ist nicht veröffentlicht."
"Powered by FerriteCMS" = "Betrieben mit FerriteCMS"
"Languages" = "Sprachen"
